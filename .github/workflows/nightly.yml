name: Nightly

on:
  schedule:
    - cron: '0 2 * * *' # 凌晨 2:00 UTC ≈ 10:00 CST
  workflow_dispatch:

jobs:
  asan:
    name: ASan
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build/asan -DCMAKE_BUILD_TYPE=Release -DMUGEN_ENABLE_ASAN=ON
      - name: Build
        run: cmake --build build/asan -j$(sysctl -n hw.ncpu)
      - name: Test
        run: ctest --test-dir build/asan --output-on-failure

  tsan:
    name: TSan
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build/tsan -DCMAKE_BUILD_TYPE=Release -DMUGEN_ENABLE_TSAN=ON
      - name: Build
        run: cmake --build build/tsan -j$(sysctl -n hw.ncpu)
      - name: Test
        run: ctest --test-dir build/tsan --output-on-failure

  benchmark:
    name: Benchmark
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build/bench -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/bench --target mugen-bench -j$(sysctl -n hw.ncpu)
      - name: Run benchmarks (quick)
        run: |
          if [ -f build/bench/src/mugen-bench ]; then
            ./build/bench/src/mugen-bench --quick 2>&1 || true
          else
            echo "Bench executable not found"
          fi
