# ──────────────────────────────────────────────────────────────
# Dependabot — keep GitHub Actions up to date
# ──────────────────────────────────────────────────────────────
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
