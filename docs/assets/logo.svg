<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <defs>
    <linearGradient id="grad-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#6c5ce7"/>
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#a29bfe"/>
    </linearGradient>
    <linearGradient id="grad-icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d2b55"/>
      <stop offset="40%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#a29bfe"/>
    </linearGradient>
  </defs>

  <!-- ===== ICON: Infinity-chip mark ===== -->
  <g transform="translate(48, 50)">
    <!-- Outer infinity path — clean geometric lemniscate -->
    <path d="M0,-1 C12,-22 34,-22 34,-1 C34,20 12,22 0,1 C-12,22 -34,20 -34,-1 C-34,-22 -12,-22 0,-1Z"
          fill="none" stroke="url(#grad-icon)" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Central chip die -->
    <rect x="-6" y="-6" width="12" height="12" rx="2" fill="url(#grad-icon)"/>
    <rect x="-3.5" y="-3.5" width="7" height="7" rx="1" fill="none" stroke="#a29bfe" stroke-width="0.6" opacity="0.7"/>

    <!-- Chip pins radiating outward (circuit traces) -->
    <line x1="6" y1="-2" x2="16" y2="-8" stroke="#6c5ce7" stroke-width="1" opacity="0.6"/>
    <line x1="6" y1="2" x2="16" y2="8" stroke="#6c5ce7" stroke-width="1" opacity="0.6"/>
    <line x1="-6" y1="-2" x2="-16" y2="-8" stroke="#6c5ce7" stroke-width="1" opacity="0.6"/>
    <line x1="-6" y1="2" x2="-16" y2="8" stroke="#6c5ce7" stroke-width="1" opacity="0.6"/>

    <!-- Connection nodes on infinity path -->
    <circle cx="18" cy="-10" r="2" fill="#a29bfe"/>
    <circle cx="18" cy="10" r="2" fill="#a29bfe"/>
    <circle cx="-18" cy="-10" r="2" fill="#a29bfe"/>
    <circle cx="-18" cy="10" r="2" fill="#a29bfe"/>
    <circle cx="30" cy="-4" r="1.5" fill="#6c5ce7" opacity="0.7"/>
    <circle cx="30" cy="4" r="1.5" fill="#6c5ce7" opacity="0.7"/>
    <circle cx="-30" cy="-4" r="1.5" fill="#6c5ce7" opacity="0.7"/>
    <circle cx="-30" cy="4" r="1.5" fill="#6c5ce7" opacity="0.7"/>
  </g>

  <!-- ===== WORDMARK: MUGEN — geometric sans, all paths ===== -->
  <g fill="url(#grad-main)">
    <!-- M: 16w -->
    <path d="M96,32 L96,62 L98.5,62 L98.5,38 L106,54 L107.5,54 L115,38 L115,62 L117.5,62 L117.5,32 L115,32 L106.75,50 L98.5,32 Z"/>
    <!-- U: 16w -->
    <path d="M124,32 L124,54 C124,59 127.5,62.5 133,62.5 C138.5,62.5 142,59 142,54 L142,32 L139.5,32 L139.5,54 C139.5,57.8 137,60.2 133,60.2 C129,60.2 126.5,57.8 126.5,54 L126.5,32 Z"/>
    <!-- G: 16w -->
    <path d="M163.5,38 C161.5,34.5 158,32 153,32 C147,32 148,32 148,32 L148,32 C148,32 145,33 145,38 L145,56 C145,61 148,62.5 153,62.5 C158.5,62.5 162,60 163.5,56.5 L163.5,48 L155,48 L155,50.3 L161,50.3 L161,55.5 C160,58.5 157,60.2 153,60.2 C149,60.2 147.5,58 147.5,55.5 L147.5,39 C147.5,35.5 149.5,34.3 153,34.3 C157,34.3 159.5,36 161.2,38.5 Z"/>
    <!-- E: 14w -->
    <path d="M170,32 L170,62 L186,62 L186,59.7 L172.5,59.7 L172.5,48.2 L184,48.2 L184,45.9 L172.5,45.9 L172.5,34.3 L186,34.3 L186,32 Z"/>
    <!-- N: 16w -->
    <path d="M192,62 L192,32 L194.5,32 L210,57 L210,32 L212.5,32 L212.5,62 L210,62 L194.5,37 L194.5,62 Z"/>
  </g>

  <!-- Kanji accent — 無限 in small text -->
  <text x="154" y="80" text-anchor="middle" fill="#6c5ce7" opacity="0.45"
        font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans CJK SC',sans-serif"
        font-size="9" font-weight="300" letter-spacing="4">
    無限
  </text>
</svg>
